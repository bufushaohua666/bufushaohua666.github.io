<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>168TI · 高中人格诊断</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f1ec;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 28px 22px 36px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.07);
            transition: 0.2s;
        }
        .page {
            display: none;
            flex-direction: column;
            gap: 18px;
        }
        .page.active {
            display: flex;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #1f1f1f;
        }
        .sub {
            color: #6b6b6b;
            font-size: 15px;
            line-height: 1.5;
            margin-top: -6px;
        }
        .badge {
            background: #e8e2dc;
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 13px;
            color: #2c2c2c;
            display: inline-block;
            width: fit-content;
        }
        .start-desc {
            background: #f8f4f1;
            border-radius: 20px;
            padding: 18px 20px;
            font-size: 15px;
            line-height: 1.7;
            color: #2c2c2c;
            margin: 4px 0 6px;
        }
        .btn {
            background: #1f1f1f;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.12s;
            width: 100%;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.97);
            background: #000;
        }
        .btn-outline {
            background: transparent;
            color: #1f1f1f;
            border: 1.5px solid #d5cdc6;
        }
        .btn-outline:active {
            background: #f0ebe7;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .progress-bar {
            height: 4px;
            background: #e5ddd8;
            border-radius: 4px;
            overflow: hidden;
            margin: 2px 0 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #1f1f1f;
            border-radius: 4px;
            transition: width 0.25s ease;
        }
        .q-counter {
            font-size: 14px;
            color: #8a8a8a;
        }
        .q-text {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.5;
            color: #1a1a1a;
            margin: 4px 0 10px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 4px 0 12px;
        }
        .option {
            background: #f7f3f0;
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 15px;
            color: #1f1f1f;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.1s;
            line-height: 1.4;
        }
        .option:active {
            transform: scale(0.98);
        }
        .option.selected {
            border-color: #1f1f1f;
            background: #ece7e4;
        }
        .result-box {
            text-align: center;
            padding: 4px 0 8px;
        }
        .result-emoji {
            font-size: 56px;
            line-height: 1.2;
        }
        .result-name {
            font-size: 26px;
            font-weight: 700;
            margin: 8px 0 4px;
            color: #1f1f1f;
        }
        .result-trigger {
            font-size: 13px;
            color: #8a8a8a;
            background: #f3efec;
            border-radius: 40px;
            padding: 6px 14px;
            display: inline-block;
            margin: 2px auto 10px;
        }
        .result-extra {
            text-align: left;
            background: #faf7f5;
            border-radius: 16px;
            padding: 16px 18px;
            margin: 14px 0 8px;
            font-size: 14px;
            line-height: 1.7;
            color: #2c2c2c;
        }
        .footer {
            font-size: 12px;
            color: #b0a8a2;
            text-align: center;
            margin-top: 18px;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 6px 0 12px;
        }
        .checkbox-item {
            background: #f7f3f0;
            border-radius: 40px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-item.selected {
            border-color: #1f1f1f;
            background: #ece7e4;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1f1f1f;
            cursor: pointer;
            flex-shrink: 0;
        }
        .checkbox-item label {
            cursor: pointer;
            flex: 1;
        }
        .ranking {
            margin-top: 12px;
            text-align: left;
            border-top: 1px solid #ece7e4;
            padding-top: 12px;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
            color: #444;
        }
        .ranking-item .rank-emoji {
            margin-right: 6px;
        }
        .ranking-item .rank-pct {
            font-weight: 600;
            color: #1f1f1f;
            min-width: 36px;
            text-align: right;
        }
        .unlock-hint {
            font-size: 13px;
            color: #888;
            background: #f8f4f1;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 8px;
            text-align: left;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="container" id="app">

    <!-- ========== 开始页 ========== -->
    <div class="page active" id="page-start">
        <div class="badge">🥳 168TI · 2026</div>
        <h1>「高中人格诊断」</h1>
        <div class="sub">测测你当年在168是哪类人</div>
        <div class="start-desc">
            ⚡ 一共 <strong>9</strong> 道必答题 + 1 道彩蛋题<br>
            选你觉得最接近的，不用想太久。<br>
            <span style="color:#8a8a8a;font-size:14px;">结果仅供怀念，不准也正常</span>
        </div>
        <button class="btn" id="btn-start">开始诊断 →</button>
        <div style="margin-top:12px;font-size:13px;color:#b0a8a2;text-align:center;">≈ 3 分钟 · 168限定</div>
    </div>

    <!-- ========== 答题页 ========== -->
    <div class="page" id="page-quiz">
        <div class="q-counter" id="q-counter">第 1 / 9 题</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="q-text" id="q-text">加载中…</div>
        <div class="options" id="q-options"></div>
        <button class="btn btn-outline" id="btn-next" disabled>下一题 →</button>
    </div>

    <!-- ========== 彩蛋页 ========== -->
    <div class="page" id="page-extra">
        <div class="badge">🎞️ 彩蛋题</div>
        <div style="font-size:18px;font-weight:600;margin:4px 0 2px;">回首168，你最怀念什么？</div>
        <div style="color:#6b6b6b;font-size:14px;margin-bottom:8px;">可多选，选完看结果</div>
        <div class="checkbox-group" id="extra-options"></div>
        <button class="btn" id="btn-extra-done">看结果 →</button>
    </div>

    <!-- ========== 结果页 ========== -->
    <div class="page" id="page-result">
        <div class="result-box">
            <div class="result-emoji" id="r-emoji">🏅</div>
            <div class="result-name" id="r-name">不负韶华</div>
            <div class="result-trigger" id="r-trigger"></div>
            <div class="result-extra" id="r-extra"></div>
            <div id="ranking-container"></div>
            <div id="unlock-hint" class="unlock-hint hidden"></div>
            <button class="btn" id="btn-restart" style="margin-top:12px;">再测一次</button>
        </div>
        <div class="footer">—— 168TI · 献给那些日子 ——</div>
    </div>

</div>

<script>
    // ============================================================
    //  题库（9题）
    // ============================================================
    const questions = [
        {
            text: "高三下学期的体育课你一般如何度过？",
            options: [
                { label: "下课铃一响就冲出教室抢占球台", val: "A" },
                { label: "课间奋笔疾书，眼保健操第三节才动身，但玩得酣畅淋漓", val: "B" },
                { label: "偶尔比较忙的时候会翘体育课，在班上写作业", val: "C" },
                { label: "不喜欢体育课，几乎每节课都在班", val: "D" }
            ]
        },
        {
            text: "下面哪项更符合你的早读状态？",
            options: [
                { label: "从不迟到，早读提前十几分钟到班，珍惜晨读时光", val: "A" },
                { label: "踩着点冲进教室，拿起书到走廊大声早读", val: "B" },
                { label: "早读？不，我在睡觉😇 冬天的空调风好舒服…", val: "C" },
                { label: "中途去上厕所，等早读快结束再回来", val: "D" }
            ]
        },
        {
            text: "课间十分钟你一般在干什么？",
            options: [
                { label: "坐在座位上奋笔疾书，或讨论题目", val: "A" },
                { label: "制裁写作业的同学，大叫一声'卷狗'！", val: "B" },
                { label: "在'阳巨杯'里挥汗如雨，或来一场Bobo", val: "C" },
                { label: "在不同楼层闲逛串班", val: "D" }
            ]
        },
        {
            text: "下午下课到晚自习前的那段时间你一般怎么度过？",
            options: [
                { label: "回家吃晚饭，收拾休息一下", val: "A" },
                { label: "在阳台吃饭，背书/狗叫中来回切换", val: "B" },
                { label: "自己去食堂吃饭", val: "C" },
                { label: "在校门外和同学们买吃，晃到快晚自习才回去", val: "D" }
            ]
        },
        {
            text: "每次月考班级贴排名表时，你一般怎么做？（请选次数最多的一项）",
            options: [
                { label: "把全班的排名都看一遍", val: "A" },
                { label: "看自己的、班级前几的和好朋友的", val: "B" },
                { label: "只看自己的", val: "C" },
                { label: "考得好就看，考得不好就不看", val: "D" }
            ]
        },
        {
            text: "下面哪一条更符合你的写作业风格？",
            options: [
                { label: "速度很快，能干很多额外任务（或纯粹用来放松）", val: "A" },
                { label: "没那么快，但很抓紧时间", val: "B" },
                { label: "不算快，经常晚自习写不完作业但基本会保证按时交", val: "C" },
                { label: "写不完就不写了（能写完也不想写）", val: "D" }
            ]
        },
        {
            text: "每次大考前你的状态是怎样的？",
            options: [
                { label: "比平时更抓紧时间，好好复习", val: "A" },
                { label: "比平时放松一点，走路或去操场跑一跑", val: "B" },
                { label: "和平时一样，该干啥干啥，保持平常心", val: "C" },
                { label: "考前难道不应该大玩特玩吗？？？", val: "D" }
            ]
        },
        {
            text: "课间班里有人传八卦，你一般是：",
            options: [
                { label: "八卦传播器——你是消息源，甚至第一个发现的", val: "A" },
                { label: "参与讨论型——不是第一个知道，但会加入讨论", val: "B" },
                { label: "八卦绝缘体——完全不知道，或半年后才恍然大悟", val: "C" }
            ]
        },
        {
            text: "考完试对答案（或听到人对答案），发现你的答案和对方不一样，你会：",
            options: [
                { label: "坚持自己的答案：'菜就多练'！", val: "A" },
                { label: "表面'呃我忘记了'，回去思考半天到底错没错", val: "B" },
                { label: "进行科学的严谨探讨，和对方讨论题目", val: "C" },
                { label: "捂着耳朵：'不听不听'", val: "D" }
            ]
        }
    ];

    // ============================================================
    //  彩蛋题选项
    // ============================================================
    const extraOptions = [
        { id: "A", label: "和同学老师的思维碰撞" },
        { id: "B", label: "溢流坝傍晚的火烧云" },
        { id: "C", label: "和好朋友在操场打球、吃饭、谈天说地" },
        { id: "D", label: "奋力拼搏时全身心的专注和对梦想的坚持" },
        { id: "E", label: "同学的鼓励、老师的关心" },
        { id: "F", label: "班会课的卡文迪什" },
        { id: "G", label: "每周一次的新闻周刊、《激荡四十年》" }
    ];

    // ============================================================
    //  人格模板 + 权重
    // ============================================================
    const personalityTemplates = {
        "不负韶华": {
            emoji: "🏅",
            answers: ["B", "B", "A", "B", ["B","C"], "B", ["B","C"], "C", "B"],
            weights: { 0: 1.25, 1: 1.25, 3: 2.0 },
            unlock: { type: "extraCount", min: 3 }
        },
        "干球者": {
            emoji: "🏓",
            answers: ["A", "B", "C", "D", "A", "A", "D", "B", "D"],
            weights: { 0: 2.0, 2: 1.5 }
        },
        "找shi吃的优秀同学": {
            emoji: "📚",
            answers: ["C", "A", "A", "C", "C", "A", "A", "C", "C"],
            weights: { 0: 1.1, 1: 1.5, 2: 1.5, 4: 1.2, 5: 1.5, 8: 2.0 }
        },
        "狗叫界第一": {
            emoji: "🐶",
            answers: ["B", "B", "B", "B", "A", "C", "D", "B", "A"],
            weights: { 2: 2.0, 3: 1.5 }
        },
        "沉思者": {
            emoji: "💭",
            answers: [["B","C","D"], ["A","B"], ["A","C","D"], ["B","C"], "C", "C", "C", "C", "C"],
            weights: { 5: 1.5, 8: 1.5 }
        },
        "八卦界MVP": {
            emoji: "🗣️",
            answers: ["A", "B", "D", "D", "A", "A", "D", "A", "D"],
            weights: { 2: 1.5, 3: 1.25, 7: 2.5 }
        },
        "汞齐乐": {
            emoji: "😎",
            answers: ["A", "D", "C", "D", "A", "A", "D", "B", "A"],
            weights: { 8: 2.5 }
        },
        "混混": {
            emoji: "🙄",
            answers: ["A", "D", ["B","D"], "D", "D", "C", "D", ["A","B"], "A"],
            weights: { 0: 1.2, 1: 2.0, 2: 1.5, 3: 1.25, 6: 1.5 }
        },
        "王总": {
            emoji: "😼",
            answers: ["A", "C", "C", "D", "D", "D", "D", "B", "C"],
            weights: { 1: 2.0, 5: 2.0, 6: 1.2 }
        },
        "不索何获": {
            emoji: "📖",
            answers: [["B"], ["D"], ["A","D"], ["A","C"], ["B"], ["C"], ["A"], ["A","B","C"], ["D"]],
            weights: { 5: 2.0 },
            unlock: { type: "extraIncludes", ids: ["C"] }
        }
    };

    const personalityOrder = [
        "不负韶华", "干球者", "找shi吃的优秀同学", "狗叫界第一",
        "沉思者", "八卦界MVP", "汞齐乐", "混混", "王总", "不索何获"
    ];

    // ============================================================
    //  状态
    // ============================================================
    let currentIdx = 0;
    let answers = [];
    let extraSelected = [];
    let selectedOptionIdx = -1;

    // ============================================================
    //  DOM 引用
    // ============================================================
    const startPage = document.getElementById("page-start");
    const quizPage = document.getElementById("page-quiz");
    const extraPage = document.getElementById("page-extra");
    const resultPage = document.getElementById("page-result");

    const qCounter = document.getElementById("q-counter");
    const progressFill = document.getElementById("progress-fill");
    const qText = document.getElementById("q-text");
    const qOptions = document.getElementById("q-options");
    const btnNext = document.getElementById("btn-next");
    const btnStart = document.getElementById("btn-start");
    const btnExtraDone = document.getElementById("btn-extra-done");
    const btnRestart = document.getElementById("btn-restart");

    function showPage(pageId) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById(pageId).classList.add("active");
    }

    // ============================================================
    //  渲染题目
    // ============================================================
    function renderQuestion(index) {
        const q = questions[index];
        qCounter.textContent = `第 ${index + 1} / ${questions.length} 题`;
        progressFill.style.width = `${(index / questions.length) * 100}%`;
        qText.textContent = q.text;
        qOptions.innerHTML = "";
        selectedOptionIdx = -1;
        btnNext.disabled = true;

        q.options.forEach((opt, i) => {
            const div = document.createElement("div");
            div.className = "option";
            div.textContent = opt.label;
            div.dataset.index = i;
            div.addEventListener("click", function () {
                document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
                this.classList.add("selected");
                selectedOptionIdx = i;
                btnNext.disabled = false;
            });
            qOptions.appendChild(div);
        });
    }

    // ============================================================
    //  渲染彩蛋题
    // ============================================================
    function renderExtra() {
        const container = document.getElementById("extra-options");
        container.innerHTML = "";
        extraSelected = [];
        extraOptions.forEach(opt => {
            const div = document.createElement("div");
            div.className = "checkbox-item";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.id = "extra-" + opt.id;
            cb.value = opt.id;
            const label = document.createElement("label");
            label.htmlFor = "extra-" + opt.id;
            label.textContent = opt.label;
            div.appendChild(cb);
            div.appendChild(label);
            div.addEventListener("click", function (e) {
                if (e.target.tagName !== "INPUT") {
                    const inp = this.querySelector("input[type=checkbox]");
                    inp.checked = !inp.checked;
                    inp.dispatchEvent(new Event("change"));
                }
            });
            cb.addEventListener("change", function () {
                if (this.checked) {
                    div.classList.add("selected");
                } else {
                    div.classList.remove("selected");
                }
            });
            container.appendChild(div);
        });
    }

    // ============================================================
    //  核心算法：加权曼哈顿距离
    // ============================================================
    function isMatch(userVal, templateVal) {
        if (Array.isArray(templateVal)) {
            return templateVal.includes(userVal);
        }
        return userVal === templateVal;
    }

    function calculateDistances(userAnswers) {
        const results = {};
        for (const [name, data] of Object.entries(personalityTemplates)) {
            let dist = 0;
            const weights = data.weights || {};
            const template = data.answers;
            for (let i = 0; i < 9; i++) {
                const w = weights[i] || 1.0;
                if (!isMatch(userAnswers[i], template[i])) {
                    dist += w;
                }
            }
            results[name] = dist;
        }
        return results;
    }

    // ============================================================
    //  解锁条件检查
    // ============================================================
    function isUnlocked(personalityName, extraSelected) {
        const data = personalityTemplates[personalityName];
        if (!data || !data.unlock) return true;
        const rule = data.unlock;
        if (rule.type === "extraIncludes") {
            return rule.ids.some(id => extraSelected.includes(id));
        }
        if (rule.type === "extraCount") {
            return extraSelected.length >= rule.min;
        }
        return true;
    }

    function getUnlockedPersonality(distances, extraSelected) {
        const sorted = personalityOrder.slice().sort((a, b) => distances[a] - distances[b]);
        for (const name of sorted) {
            if (isUnlocked(name, extraSelected)) {
                return name;
            }
        }
        return sorted[0];
    }

    // ============================================================
    //  结果页展示
    // ============================================================
    function showResult(userAnswers, extraSelected) {
        const distances = calculateDistances(userAnswers);
        const topName = getUnlockedPersonality(distances, extraSelected);
        const topData = personalityTemplates[topName];

        document.getElementById("r-emoji").textContent = topData.emoji;
        document.getElementById("r-name").textContent = topName;
        document.getElementById("r-trigger").textContent =
            `匹配度 ${Math.round((1 - distances[topName] / 12) * 100)}% · 距离 ${distances[topName].toFixed(1)}`;

        let extraHtml = "";
        if (extraSelected.length > 0) {
            extraHtml = "<strong>🏷️ 你最怀念的：</strong><br>";
            extraSelected.forEach(id => {
                const label = extraOptions.find(o => o.id === id)?.label || id;
                extraHtml += "· " + label + "<br>";
            });
        } else {
            extraHtml = "<span style='color:#8a8a8a;'>你跳过了彩蛋题</span>";
        }
        document.getElementById("r-extra").innerHTML = extraHtml;

        const hintEl = document.getElementById("unlock-hint");
        let skipped = [];
        const sortedAll = personalityOrder.slice().sort((a, b) => distances[a] - distances[b]);
        for (const name of sortedAll) {
            if (!isUnlocked(name, extraSelected)) {
                const data = personalityTemplates[name];
                let reason = "";
                if (data.unlock.type === "extraIncludes") {
                    reason = `需要彩蛋选 ${data.unlock.ids.join('、')}`;
                } else if (data.unlock.type === "extraCount") {
                    reason = `需要彩蛋选 ≥${data.unlock.min} 项（你选了 ${extraSelected.length} 项）`;
                }
                skipped.push(`${data.emoji} ${name}（${reason}）`);
            }
        }
        if (skipped.length > 0) {
            hintEl.classList.remove("hidden");
            hintEl.innerHTML = `🔒 以下人格因彩蛋条件未满足而跳过：<br>${skipped.join('<br>')}`;
        } else {
            hintEl.classList.add("hidden");
        }

        const rankContainer = document.getElementById("ranking-container");
        rankContainer.innerHTML = '<div class="ranking"><div style="font-weight:600;font-size:14px;margin-bottom:6px;">📊 匹配度排名</div>';
        const maxDist = 12;
        for (const name of sortedAll.slice(0, 5)) {
            const data = personalityTemplates[name];
            const dist = distances[name];
            const pct = Math.round((1 - dist / maxDist) * 100);
            const unlocked = isUnlocked(name, extraSelected);
            rankContainer.innerHTML += `
                <div class="ranking-item">
                    <span><span class="rank-emoji">${data.emoji}</span> ${name} ${unlocked ? '' : '🔒'}</span>
                    <span class="rank-pct">${pct}%</span>
                </div>
            `;
        }
        rankContainer.innerHTML += '</div>';

        showPage("page-result");
        progressFill.style.width = "100%";
    }

    // ============================================================
    //  事件绑定
    // ============================================================
    btnStart.addEventListener("click", function () {
        currentIdx = 0;
        answers = [];
        showPage("page-quiz");
        renderQuestion(currentIdx);
    });

    btnNext.addEventListener("click", function () {
        if (selectedOptionIdx === -1) return;
        const q = questions[currentIdx];
        const val = q.options[selectedOptionIdx].val;
        answers.push(val);
        currentIdx++;
        if (currentIdx < questions.length) {
            renderQuestion(currentIdx);
        } else {
            renderExtra();
            showPage("page-extra");
        }
    });

    btnExtraDone.addEventListener("click", function () {
        const checkboxes = document.querySelectorAll("#extra-options input[type=checkbox]");
        extraSelected = [];
        checkboxes.forEach(cb => {
            if (cb.checked) extraSelected.push(cb.value);
        });
        showResult(answers, extraSelected);
    });

    btnRestart.addEventListener("click", function () {
        currentIdx = 0;
        answers = [];
        extraSelected = [];
        showPage("page-start");
        progressFill.style.width = "0%";
    });

    showPage("page-start");
</script>
</body>
</html>
